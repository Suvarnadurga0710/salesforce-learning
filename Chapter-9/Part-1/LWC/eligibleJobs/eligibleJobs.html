<template>
    <lightning-card title="Eligible Jobs" icon-name="standard:job_position">
        <div class="slds-p-around_medium">

            <template if:true={isLoading}>
                <lightning-spinner
                    alternative-text="Loading jobs">
                </lightning-spinner>
            </template>

            <template if:false={isLoading}>

                <template if:true={hasJobs}>

                    <template for:each={jobs} for:item="job">

                        <div key={job.id}
                             class="slds-box slds-m-bottom_medium">

                            <h2 class="slds-text-heading_medium">
                                {job.company}
                            </h2>

                            <p>
                                <strong>Job Role:</strong> {job.role}
                            </p>

                            <p>
                                <strong>Package:</strong> {job.package}
                            </p>

                            <p>
                                <strong>Location:</strong> {job.location}
                            </p>

                            <p>
                                <strong>Deadline:</strong> {job.deadline}
                            </p>

                            <div class="slds-m-top_small">
                                <lightning-button
                                    label="View Details"
                                    variant="brand"
                                    data-id={job.id}
                                    onclick={handleViewDetails}>
                                </lightning-button>
                            </div>

                        </div>

                    </template>

                </template>

                <template if:false={hasJobs}>
                    <div class="slds-align_absolute-center slds-p-around_large">
                        <p>No eligible jobs are currently available.</p>
                    </div>
                </template>

            </template>

        </div>
    </lightning-card>
</template>
